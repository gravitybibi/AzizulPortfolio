  <style>
    body {
      height: 100vh;
      margin: 0;
      background: #ffffff;
    }

    /* Navbar spacing */
    .navbar-nav .nav-item {
      margin: 0 15px;
    }

    /* Navbar links */
    .nav-link {
      color: white !important;
      font-size: 16px;
    }

    /* Card styling */
    .custom-card {
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      background: white;
      border: 2px solid #e5e5e5;
      /* makes it visible */
    }

    /* Gallery Images */
    .gallery-img {
      cursor: pointer;
      border-radius: 10px;
      transition: transform 0.3s;
    }

    .gallery-img:hover {
      transform: scale(1.05);
    }

    /* Modal */
    .custom-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;

      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px); /* 🔥 blur background */

      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .custom-modal img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
    }

  </style>
</head>
